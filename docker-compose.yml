services:
  zenfeed-web:
    image: vandeefeng/zenfeed-web:latest
    ports:
      - "1400:1400"
    environment:
      - PUBLIC_DEFAULT_API_URL=http://zenfeed:1300
      - PRIVATE_BEARER_TOKEN=${BEARER_TOKEN:-your-api-token}
    depends_on:
      - zenfeed
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  zenfeed:
    image: vandeefeng/zenfeed:latest
    entrypoint: >
      sh -c "
      if [ ! -f /app/config/config.yaml ]; then
        echo 'Config file not found in volume, initializing from base config...'
        cp /app/config.base.yaml /app/config/config.yaml;
      else
        echo 'Existing config file found in volume.'
      fi &&
      echo 'Starting Zenfeed...' &&
      exec /app/zenfeed --config /app/config/config.yaml
      "
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN:-your-api-token}
      - GENERAL_API_KEY=${GENERAL_API_KEY:-your-api-key}
      - EMBED_API_KEY=${EMBED_API_KEY:-your-api-key}
      - DEV_MODE=${DEV_MODE:-false}
    configs:
      - source: zenfeed_config_base
        target: /app/config.base.yaml
    volumes:
      - data:/app/data
      - config:/app/config
    ports:
      - "1300:1300"
      - "1301:1301"
    depends_on:
      - rsshub
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rsshub:
    image: diygod/rsshub:2024-12-14
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
      
volumes:
  data: {}
  config: {}

configs:
  zenfeed_config_base:
    content: |
      timezone: ${TZ:-Asia/Shanghai}
      api:
        http:
          bearer_token: ${BEARER_TOKEN:-your-api-token}
          dev_mode: ${DEV_MODE:-false}
      llms:
        - name: general
          default: true
          provider: openai
          model: grok-3-mini-beta
          endpoint: ${GENERAL_API_ENDPOINT:-https://your-api-endpoint}
          api_key: ${GENERAL_API_KEY:-your-api-key}
        - name: embed
          provider: openai
          endpoint: ${EMBED_API_ENDPOINT:-https://your-api-endpoint}
          embedding_model: bge-m3:latest
          api_key: ${EMBED_API_KEY:-your-api-key}
      scrape:
        rsshub_endpoint: http://rsshub:1200
      storage:
        feed:
          rewrites:
            - transform:
                to_text:
                  prompt: |
                    {{ .summary_html_snippet }} Respond in ${LANG:-Chinese}
              label: summary_html_snippet
            - transform:
                to_text:
                  prompt: |
                    {{ .category }}
              label: category
            - transform:
                to_text:
                  prompt: |
                    {{ .tags }}
              label: tags
            - transform:
                to_text:
                  prompt: |
                    {{ .score }}
              label: score
          embedding_llm: embed
      notify:
        channels:
          email:
            feed_html_snippet_template: |
              {{ .summary_html_snippet }}